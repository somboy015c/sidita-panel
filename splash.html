<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(135deg, #17915F 0%, #0A4E36 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .badge {
    width: 96px;
    height: 96px;
    border-radius: 26px;
    background: linear-gradient(160deg, #F0D27A 0%, #A9841A 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    font-weight: 700;
    color: #0A4E36;
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.3);
  }
  .name {
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .spinner {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.25);
    border-top-color: #D4AA33;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">S</div>
    <div class="name">Sidita Panel</div>
    <div class="spinner"></div>
  </div>
</body>
</html>
