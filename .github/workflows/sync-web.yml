name: Sync Website into App

# Run this manually from the Actions tab whenever the sidita-admin website
# has changed. It pulls the latest site, updates www/, and commits the
# result straight to this repo — no local terminal needed.

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Website repo to pull from'
        required: false
        default: 'https://github.com/somboy015c/sidita-admin.git'
      source_branch:
        description: 'Branch to pull'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run sync script
        env:
          SOURCE_REPO: ${{ github.event.inputs.source_repo }}
          SOURCE_BRANCH: ${{ github.event.inputs.source_branch }}
        run: bash scripts/sync-web.sh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sync admin website content into app"
            git push
          fi
